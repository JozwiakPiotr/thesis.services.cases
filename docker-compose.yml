services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro,Z
    ports:
      - "8080:8080"

  apiservice:
    image: piotrmaciejjozwiak/apiservice:0.0.1
    build:
      context: ./src
      dockerfile: CasesApp.ApiService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__cases: Host=postgres;Port=5432;Database=cases;Username=postgres;Password=postgres
      Keycloak__Authority: http://localhost:8080/realms/cases
      Keycloak__Audience: api
      Keycloak__MetadataAddress: http://keycloak:8080/realms/cases/.well-known/openid-configuration
      Keycloak__BackchannelBaseAddress: http://keycloak:8080
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8081:8080"

  debtorapp:
    image: piotrmaciejjozwiak/debtorapp:0.0.4
    build:
      context: ./src
      dockerfile: DebtorApp/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      CasesApi__BaseAddress: http://apiservice:8080
      Keycloak__Authority: http://localhost:8080/realms/cases
      Keycloak__MetadataAddress: http://keycloak:8080/realms/cases/.well-known/openid-configuration
      Keycloak__BackchannelBaseAddress: http://keycloak:8080
      Keycloak__ClientId: debtorapp
    depends_on:
      apiservice:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "8083:8080"

  paymentsapi:
    profiles: ["payments"]
    image: piotrmaciejjozwiak/paymentsapi:0.0.1
    build:
      context: ./src
      dockerfile: PaymentsApp.ApiService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__payments: Host=postgres;Port=5432;Database=payments;Username=postgres;Password=postgres
      Keycloak__Authority: http://localhost:8080/realms/cases
      Keycloak__Audience: api
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8082:8080"

  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    depends_on:
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro,z

