---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "apiservice-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "apiservice"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  ConnectionStrings__cases: "Host=postgres-service;Port=5432;Username=postgres;Password={{ .Values.secrets.apiservice.postgres_password }};Database=cases"
  CASES_PASSWORD: "{{ .Values.secrets.apiservice.postgres_password }}"
  CASES_URI: "postgresql://postgres:{{ .Values.secrets.apiservice.postgres_password }}@postgres-service:5432/cases"
type: "Opaque"
