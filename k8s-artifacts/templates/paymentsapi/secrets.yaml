---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "paymentsapi-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "paymentsapi"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  ConnectionStrings__payments: "Host=postgres-service;Port=5432;Username=postgres;Password={{ .Values.secrets.paymentsapi.postgres_password }};Database=payments"
  PAYMENTS_PASSWORD: "{{ .Values.secrets.paymentsapi.postgres_password }}"
  PAYMENTS_URI: "postgresql://postgres:{{ .Values.secrets.paymentsapi.postgres_password }}@postgres-service:5432/payments"
type: "Opaque"
