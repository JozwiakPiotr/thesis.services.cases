---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "keycloak-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "keycloak"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ .Values.secrets.keycloak.keycloak_password }}"
type: "Opaque"
