---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "keycloak-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "keycloak"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: "{{ .Values.config.keycloak.KC_BOOTSTRAP_ADMIN_USERNAME }}"
  KC_HEALTH_ENABLED: "{{ .Values.config.keycloak.KC_HEALTH_ENABLED }}"
  KC_FEATURES: "{{ .Values.config.keycloak.KC_FEATURES }}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.config.keycloak.OTEL_EXPORTER_OTLP_ENDPOINT }}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "{{ .Values.config.keycloak.OTEL_EXPORTER_OTLP_PROTOCOL }}"
  OTEL_SERVICE_NAME: "{{ .Values.config.keycloak.OTEL_SERVICE_NAME }}"
