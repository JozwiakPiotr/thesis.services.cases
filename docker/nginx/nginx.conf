events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    upstream debtorapp {
        server 192.168.102.1:5590;
    }

    server {
        listen 80;
        server_name keycloak.contoso.lab cases.contoso.lab debtorapp.contoso.lab;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name keycloak.contoso.lab;

        ssl_certificate /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;

        location / {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name cases.contoso.lab debtorapp.contoso.lab;

        ssl_certificate /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;

        location / {
            proxy_pass http://debtorapp;
            proxy_http_version 1.1;
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
