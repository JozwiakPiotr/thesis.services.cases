apiVersion: apps/v1
kind: Deployment
metadata: 
  name: debtorapp
  namespace: cases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debtorapp
  template:
    metadata:
      labels:
        app: debtorapp
    spec:
      containers:
      - name: debtorapp
        image: piotrmaciejjozwiak/debtorapp:0.0.4
        envFrom:
          - configMapRef:
              name: debtorapp-config
        ports:
          - name: http
            containerPort: 8080
        imagePullPolicy: IfNotPresent
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: debtorapp-config
  namespace: cases
data:
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  CasesApi__BaseAddress: http://apiservice.cases.svc.cluster.local:8080
  Keycloak__Authority: https://keycloak.contoso.lab/realms/cases
  Keycloak__MetadataAddress: http://keycloak.cases.svc.cluster.local:8080/realms/cases/.well-known/openid-configuration
  Keycloak__ClientId: debtorapp
---

apiVersion: v1
kind: Service
metadata:
  name: debtorapp
  namespace: cases
spec:
  selector:
    app: debtorapp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---

apiVersion: v1
kind: Secret
metadata:
  name: wildcard-tls
  namespace: cases
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: cases
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "debtorapp"
spec:
  tls:
    - hosts:
        - debtorapp.contoso.lab
      secretName: wildcard-tls # <-- tu jest podpięty Secret z tls.crt i key.crt
  rules:
    - host: debtorapp.contoso.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: debtorapp
                port:
                  number: 8080