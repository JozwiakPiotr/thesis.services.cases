apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: cases
data:
  krb5.conf: |
    [libdefaults]
      default_realm = CONTOSO.LAB
      dns_lookup_realm = false
      dns_lookup_kdc = false
      rdns = false
      default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
      default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
      permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

    [realms]
        CONTOSO.LAB = {
            kdc = 192.168.122.137
            admin_server = 192.168.122.137
        }

    [domain_realm]
        .contoso.lab = CONTOSO.LAB
        contoso.lab = CONTOSO.LAB
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: cases
data:
  cases.json: |
    {
      "realm": "cases",
      "enabled": true,
      "clients": [
        {
          "clientId": "api",
          "name": "Cases and payments APIs",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": false,
          "protocolMappers": [
            {
              "name": "api-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "api",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "debtorapp",
          "name": "Debtor web application",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "directAccessGrantsEnabled": false,
          "standardFlowEnabled": true,
          "redirectUris": [
            "http://localhost:5590/signin-oidc",
            "https://localhost:7338/signin-oidc",
            "http://192.168.102.1:5590/signin-oidc",
            "https://192.168.102.1:7338/signin-oidc",
            "http://cases.contoso.lab/signin-oidc",
            "https://cases.contoso.lab/signin-oidc",
            "http://debtorapp.contoso.lab/signin-oidc",
            "https://debtorapp.contoso.lab/signin-oidc"
          ],
          "webOrigins": [
            "http://localhost:5590",
            "https://localhost:7338",
            "http://192.168.102.1:5590",
            "https://192.168.102.1:7338",
            "http://cases.contoso.lab",
            "https://cases.contoso.lab",
            "http://debtorapp.contoso.lab",
