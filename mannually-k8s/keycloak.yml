apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: cases
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6
          args: ["start-dev", "--import-realm"]
          env:
            - name: KRB5_CONFIG
              value: "/etc/krb5.conf"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin-password
            - name: KC_TRUSTSTORE_PATHS
              value: "/opt/keycloak/conf/truststore"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HOSTNAME
              value: "https://keycloak.contoso.lab"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: krb5-conf
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: keytab
              mountPath: /etc/security/keytabs/keycloak.keytab
              subPath: keycloak.keytab
              readOnly: true
            - name: truststore
              mountPath: /opt/keycloak/conf/truststore/Contoso-Lab-Root-CA.crt
              subPath: Contoso-Lab-Root-CA.crt
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import/cases.json
              subPath: cases.json
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
        - name: truststore
          secret:
            secretName: keycloak-secrets
            items:
              - key: Contoso-Lab-Root-CA.crt
                path: Contoso-Lab-Root-CA.crt
            defaultMode: 0444
        - name: krb5-conf
          configMap:
            name: keycloak-config
        - name: keytab
          secret:
            secretName: keycloak-secrets
            items:
              - key: keycloak.keytab
                path: keycloak.keytab
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: keycloak-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---

apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: cases
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: cases
spec:
  tls:
    - hosts:
        - keycloak.contoso.lab
      secretName: keycloak-tls # <-- tu jest podpięty Secret z tls.crt i key.crt
  rules:
    - host: keycloak.contoso.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080