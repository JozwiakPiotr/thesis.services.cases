services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak.contoso.lab
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"

  apiservice:
    build:
      context: .
      dockerfile: docker/CasesApp.ApiService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__cases: Host=postgres;Port=5432;Database=cases;Username=postgres;Password=postgres
      Keycloak__Authority: https://keycloak.contoso.lab/realms/cases
      Keycloak__Audience: api
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    extra_hosts:
      - "keycloak.contoso.lab:host-gateway"
    ports:
      - "8081:8080"

  paymentsapi:
    build:
      context: .
      dockerfile: docker/PaymentsApp.ApiService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__payments: Host=postgres;Port=5432;Database=payments;Username=postgres;Password=postgres
      Keycloak__Authority: https://keycloak.contoso.lab/realms/cases
      Keycloak__Audience: api
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    extra_hosts:
      - "keycloak.contoso.lab:host-gateway"
    ports:
      - "8082:8080"

  debtorapp:
    build:
      context: .
      dockerfile: docker/DebtorApp/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Keycloak__Authority: https://keycloak.contoso.lab/realms/cases
      Keycloak__ClientId: debtorapp
    depends_on:
      apiservice:
        condition: service_started
      keycloak:
        condition: service_started
    extra_hosts:
      - "keycloak.contoso.lab:host-gateway"
    ports:
      - "8083:8080"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro,z

volumes:
  keycloak_data:
  postgres_data:
